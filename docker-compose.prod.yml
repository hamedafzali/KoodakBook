services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       koodakbook
      POSTGRES_USER:     koodakbook
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koodakbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT:           4000
      DATABASE_URL:   postgres://koodakbook:${DB_PASSWORD}@db:5432/koodakbook
      JWT_SECRET:     ${JWT_SECRET:?required}
      JWT_EXPIRES_IN: 30d
      WEB_URL:        https://${DOMAIN:?required}
      UPLOADS_DIR:    /app/uploads
      ADMIN_EMAIL:    ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      AI_API_KEY:     ${AI_API_KEY:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BACKEND_URL: https://api.${DOMAIN}

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BACKEND_URL: https://api.${DOMAIN}
    ports:
      - "127.0.0.1:3001:3001"   # localhost only — access via SSH tunnel

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - uploads:/app/uploads:ro
    depends_on:
      - web
      - backend
    environment:
      - DOMAIN=${DOMAIN}

volumes:
  postgres_data:
  uploads:
