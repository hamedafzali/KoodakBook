services:

  db:
    build:
      context: .
      dockerfile: apps/db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB:       koodakbook
      POSTGRES_USER:     koodakbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in project variables}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koodakbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT:              4000
      DATABASE_URL:      postgres://koodakbook:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in project variables}@db:5432/koodakbook
      JWT_SECRET:        ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN:    30d
      WEB_URL:           ${WEB_URL:-http://localhost:3001}
      ADMIN_URL:         ${ADMIN_URL:-http://localhost:3002}
      UPLOADS_DIR:       /app/uploads
      ADMIN_EMAIL:       ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD:    ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # One key for whichever AI provider is selected in the admin panel.
      # Set AI_API_KEY in ACM to that provider's key (Anthropic / OpenAI /
      # DeepSeek / Kimi / Qwen / …).
      AI_API_KEY:         ${AI_API_KEY:-}
      # Cloud TTS keys — per-engine names win, TTS_API_KEY is the shared
      # fallback. Values come from the .env file next to this compose file.
      TTS_API_KEY:        ${TTS_API_KEY:-}
      TTS_ELEVENLABS_KEY: ${TTS_ELEVENLABS_KEY:-}
      TTS_AZURE_KEY:      ${TTS_AZURE_KEY:-}
      TTS_OPENAI_KEY:     ${TTS_OPENAI_KEY:-}
      # Free-photo picker sources (admin words page) — optional, better results.
      PIXABAY_API_KEY:    ${PIXABAY_API_KEY:-}
      PEXELS_API_KEY:     ${PEXELS_API_KEY:-}
      # Free baseline voice (Piper sidecar) — always available, no key.
      PIPER_URL:          http://piper:5000
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  # Free, offline Persian TTS (all fa_IR Piper voices). Baseline story audio.
  # Memory-capped so a long regeneration can't exhaust this small host and take
  # the stack down — if it hits the cap it restarts (clients retry).
  piper:
    build:
      context: .
      dockerfile: apps/piper/Dockerfile
    restart: unless-stopped
    mem_limit: 900m
    memswap_limit: 900m

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "3002:3001"
    depends_on:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "3001:3000"
    depends_on:
      - backend

  # ── Phase 1B: encrypted offsite backups + weekly tested restore ────────────
  # One image, three roles. Scheduler runs twice-daily backups + a weekly
  # restore-drill; the same image also serves Item 2's on-demand pre-migration
  # dump. Secrets come from ACM project variables, never committed.
  db-backup:
    build:
      context: ./docker/db-backup
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ:                ${TZ:-Europe/Berlin}
      # Source DB (least-privilege read-only role — see docker/db-backup/backup-role.sql)
      PGHOST:            db
      PGPORT:            "5432"
      PGDATABASE:        koodakbook
      PGUSER:            backup
      PGPASSWORD:        ${BACKUP_DB_PASSWORD:?required}
      # Offsite object store (Cloudflare R2)
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?required}
      BACKUP_S3_PROVIDER: Cloudflare
      BACKUP_S3_REGION:   auto
      BACKUP_BUCKET:      ${BACKUP_BUCKET:?required}
      BACKUP_PREFIX:      ${BACKUP_PREFIX:-koodakbook}
      BACKUP_KEY_ID:      ${BACKUP_KEY_ID:?required}       # write+list only
      BACKUP_KEY_SECRET:  ${BACKUP_KEY_SECRET:?required}
      RESTORE_KEY_ID:     ${RESTORE_KEY_ID:?required}      # read only
      RESTORE_KEY_SECRET: ${RESTORE_KEY_SECRET:?required}
      # Encryption — PUBLIC key only lives here; private key stays off-server.
      AGE_RECIPIENT:      ${AGE_RECIPIENT:?required}
      AGE_IDENTITY:       ${AGE_IDENTITY:-}                # machine-drill decrypt key (ACM var)
      # Dead-man's switch (healthchecks.io) — absence of a ping alerts.
      HEARTBEAT_BACKUP_URL: ${HEARTBEAT_BACKUP_URL:-}
      HEARTBEAT_DRILL_URL:  ${HEARTBEAT_DRILL_URL:-}
      # Scratch restore target (see db-drill below)
      DRILL_PGHOST:       db-drill
      DRILL_PGPASSWORD:   ${DRILL_PGPASSWORD:?required}
    volumes:
      - backup_staging:/staging
    depends_on:
      db:
        condition: service_healthy
      db-drill:
        condition: service_healthy

  # Dataless Postgres used ONLY as the weekly restore-drill target. Holds no real
  # data; the drill creates and drops a scratch database inside it each run. Kept
  # separate from `db` so a restore can never contend with or corrupt prod's
  # server. (See restore-drill.sh header for why this is not a socket-spawned
  # container.)
  db-drill:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DRILL_PGPASSWORD:?required}
      POSTGRES_DB:       postgres
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "fsync=off"]
    tmpfs:
      - /var/lib/postgresql/data          # ephemeral — nothing here must survive a restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads:
  backup_staging:
