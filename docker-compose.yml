services:

  db:
    build:
      context: .
      dockerfile: apps/db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB:       koodakbook
      POSTGRES_USER:     koodakbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in project variables}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koodakbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT:              4000
      DATABASE_URL:      postgres://koodakbook:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in project variables}@db:5432/koodakbook
      JWT_SECRET:        ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN:    30d
      WEB_URL:           ${WEB_URL:-http://localhost:3001}
      ADMIN_URL:         ${ADMIN_URL:-http://localhost:3002}
      UPLOADS_DIR:       /app/uploads
      ADMIN_EMAIL:       ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD:    ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # One key for whichever AI provider is selected in the admin panel.
      # Set AI_API_KEY in ACM to that provider's key (Anthropic / OpenAI /
      # DeepSeek / Kimi / Qwen / …).
      AI_API_KEY:         ${AI_API_KEY:-}
      # Separate key for the text-to-speech provider (story audio). Set in ACM.
      TTS_API_KEY:        ${TTS_API_KEY:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "3002:3001"
    depends_on:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
