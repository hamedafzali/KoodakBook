services:

  db:
    build:
      context: .
      dockerfile: apps/db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB:       koodakbook
      POSTGRES_USER:     koodakbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in project variables}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koodakbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT:              4000
      DATABASE_URL:      postgres://koodakbook:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in project variables}@db:5432/koodakbook
      JWT_SECRET:        ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN:    30d
      WEB_URL:           ${WEB_URL:-http://localhost:3001}
      ADMIN_URL:         ${ADMIN_URL:-http://localhost:3002}
      UPLOADS_DIR:       /app/uploads
      ADMIN_EMAIL:       ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD:    ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # One key for whichever AI provider is selected in the admin panel.
      # Set AI_API_KEY in ACM to that provider's key (Anthropic / OpenAI /
      # DeepSeek / Kimi / Qwen / …).
      AI_API_KEY:         ${AI_API_KEY:-}
      # Cloud TTS keys — per-engine names win, TTS_API_KEY is the shared
      # fallback. Values come from the .env file next to this compose file.
      TTS_API_KEY:        ${TTS_API_KEY:-}
      TTS_ELEVENLABS_KEY: ${TTS_ELEVENLABS_KEY:-}
      TTS_AZURE_KEY:      ${TTS_AZURE_KEY:-}
      TTS_OPENAI_KEY:     ${TTS_OPENAI_KEY:-}
      # Free-photo picker sources (admin words page) — optional, better results.
      PIXABAY_API_KEY:    ${PIXABAY_API_KEY:-}
      PEXELS_API_KEY:     ${PEXELS_API_KEY:-}
      # Telegram — three separate bots, each with its own token (never share
      # one across these): public channel posts (docs/telegram-channel.md),
      # private admin DMs (docs/admin-notify.md). Without a token each
      # integration dry-runs to logs. See docs/telegram-approval-queue.md for
      # how content reaches the channel (always via human approval).
      TELEGRAM_BOT_TOKEN:       ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL:         ${TELEGRAM_CHANNEL:-@koodakbook_app}
      ADMIN_TELEGRAM_BOT_TOKEN: ${ADMIN_TELEGRAM_BOT_TOKEN:-}
      ADMIN_TELEGRAM_CHAT_ID:   ${ADMIN_TELEGRAM_CHAT_ID:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "3002:3001"
    depends_on:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined at `next build` time, so this must be
        # a build arg, not just an `environment:` entry below — a runtime env
        # var on the container has no effect on the already-built JS/metadata
        # (sitemap.ts, robots.ts, layout.tsx's metadataBase all read it at
        # build time and are cached, per Next's sitemap.js docs). Set
        # NEXT_PUBLIC_SITE_URL as an ACM project variable for this env; it
        # flows in here via `docker compose --env-file .env.<env>`.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "3001:3000"
    depends_on:
      - backend

  # ── Phase 1B: encrypted offsite backups + weekly tested restore ────────────
  # One image, three roles. Scheduler runs twice-daily backups + a weekly
  # restore-drill; the same image also serves Item 2's on-demand pre-migration
  # dump. Secrets come from ACM project variables, never committed.
  #
  # CURRENTLY DISABLED (profiles: ["backup"], not in the default profile set).
  # See docker/db-backup/README.md "Backup sidecar is currently DISABLED" for
  # what that means and the risk while it's off. Re-enable: set
  # COMPOSE_PROFILES=backup plus AGE_RECIPIENT, BACKUP_DB_PASSWORD,
  # DRILL_PGPASSWORD, and the two HEARTBEAT_*_URL vars in ACM.
  #
  # The three vars below are soft-defaulted (${VAR:-}) so `docker compose up`
  # resolves cleanly with the profile inactive — that is a COMPOSE-level
  # convenience only, not a runtime exemption: require_backup_config() in
  # lib.sh still hard-fails (FATAL + a dead-man's-switch FAIL ping) the moment
  # the profile IS active and any of them is actually missing. A blank default
  # here must never be mistaken for "backups quietly skip" — see backup.sh's
  # on_err trap and lib.sh:require_backup_config.
  db-backup:
    profiles: ["backup"]
    build:
      context: ./docker/db-backup
    restart: unless-stopped
    # supercronic's own zombie-reaper crashes when it is PID 1 ("Failed to fork
    # exec: no such file or directory") — let Docker's tini be PID 1 instead and
    # disable supercronic's reaper in entrypoint.sh.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ:                ${TZ:-Europe/Berlin}
      # Source DB (least-privilege read-only role — see docker/db-backup/backup-role.sql)
      PGHOST:            db
      PGPORT:            "5432"
      PGDATABASE:        koodakbook
      PGUSER:            backup
      PGPASSWORD:        ${BACKUP_DB_PASSWORD:-}
      # Offsite destination — DEFERRED (see docker/db-backup/README.md "Local-only
      # mode"). BACKUP_OFFSITE defaults to 1 (offsite required); set explicitly to
      # 0 to run local-only. That flag — NOT leaving these blank — is what
      # controls the mode: with BACKUP_OFFSITE unset/1, lib.sh:require_backup_config
      # still hard-fails on missing S3 vars, so a real destination must be wired
      # back up (Cloudflare R2, or any S3-compatible target — MinIO in front of a
      # NAS/disk is config-only, see README "R2 rehearsal watch" / roadmap).
      BACKUP_OFFSITE:     ${BACKUP_OFFSITE:-1}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      BACKUP_S3_REGION:   ${BACKUP_S3_REGION:-auto}
      BACKUP_BUCKET:      ${BACKUP_BUCKET:-}
      BACKUP_PREFIX:      ${BACKUP_PREFIX:-koodakbook}
      BACKUP_KEY_ID:      ${BACKUP_KEY_ID:-}                # write+list only
      BACKUP_KEY_SECRET:  ${BACKUP_KEY_SECRET:-}
      RESTORE_KEY_ID:     ${RESTORE_KEY_ID:-}               # read only
      RESTORE_KEY_SECRET: ${RESTORE_KEY_SECRET:-}
      # Encryption — PUBLIC key only lives here; private key stays off-server.
      AGE_RECIPIENT:      ${AGE_RECIPIENT:-}
      AGE_IDENTITY:       ${AGE_IDENTITY:-}                # machine-drill decrypt key (ACM var)
      # Dead-man's switch (healthchecks.io) — absence of a ping alerts.
      HEARTBEAT_BACKUP_URL: ${HEARTBEAT_BACKUP_URL:-}
      HEARTBEAT_DRILL_URL:  ${HEARTBEAT_DRILL_URL:-}
      # Scratch restore target (see db-drill below)
      DRILL_PGHOST:       db-drill
      DRILL_PGPASSWORD:   ${DRILL_PGPASSWORD:-}
    volumes:
      - backup_staging:/staging
    depends_on:
      db:
        condition: service_healthy
      db-drill:
        condition: service_healthy

  # Dataless Postgres used ONLY as the weekly restore-drill target. Holds no real
  # data; the drill creates and drops a scratch database inside it each run. Kept
  # separate from `db` so a restore can never contend with or corrupt prod's
  # server. (See restore-drill.sh header for why this is not a socket-spawned
  # container.)
  #
  # CURRENTLY DISABLED — see db-backup above. POSTGRES_PASSWORD is soft-defaulted
  # for the same compose-resolves-clean reason; if the profile is ever active
  # with DRILL_PGPASSWORD blank, the official postgres image itself refuses to
  # start ("Database is uninitialized and superuser password is not specified"),
  # which is its own loud, fail-closed behavior — not something this compose
  # file needs to re-implement.
  db-drill:
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DRILL_PGPASSWORD:-}
      POSTGRES_DB:       postgres
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "fsync=off"]
    tmpfs:
      - /var/lib/postgresql/data          # ephemeral — nothing here must survive a restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads:
  backup_staging:
