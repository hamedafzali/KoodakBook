services:

  db:
    build:
      context: .
      dockerfile: apps/db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB:       koodakbook
      POSTGRES_USER:     koodakbook
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koodakbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT:              4000
      DATABASE_URL:      postgres://koodakbook:${DB_PASSWORD:-changeme}@db:5432/koodakbook
      JWT_SECRET:        ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN:    30d
      WEB_URL:           ${WEB_URL:-http://localhost:3000}
      UPLOADS_DIR:       /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
