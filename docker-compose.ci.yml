# Ephemeral stack for E2E in CI / the ACM pipeline. No host ports (internal
# network only) so it never conflicts with the running production stack.
# Usage:
#   docker compose -f docker-compose.ci.yml -p kb-ci up --build \
#       --abort-on-container-exit --exit-code-from playwright
#   docker compose -f docker-compose.ci.yml -p kb-ci down -v
name: kb-ci

services:
  db:
    build:
      context: .
      dockerfile: apps/db/Dockerfile
    environment:
      POSTGRES_DB: koodakbook
      POSTGRES_USER: koodakbook
      POSTGRES_PASSWORD: ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koodakbook"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://koodakbook:ci@db:5432/koodakbook
      JWT_SECRET: ci_secret_only_for_ephemeral_e2e_runs_change_me
      JWT_EXPIRES_IN: 30d
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: test1234
      UPLOADS_DIR: /app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    # Pinned tag + "missing" = pull ONCE, then always reuse the cached image
    # on the server. It only re-downloads if the image is removed (e.g. a
    # `docker system prune -a` or ACM's prune wiping unused images).
    pull_policy: missing
    working_dir: /work/e2e
    environment:
      BASE_URL: http://web:3000
      CI: "true"
    volumes:
      - ./e2e:/work/e2e
    command: sh -c "npm ci && npx playwright test"
    depends_on:
      - web
