name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Typecheck every workspace. admin/mobile/shared/backend's own `lint`
      # script IS `tsc --noEmit`, so `turbo lint` covers them; web's `lint`
      # is `eslint` instead, which currently fails on ~37 pre-existing
      # style errors unrelated to this workflow (see project.md backlog) —
      # so web is typechecked directly here rather than gating CI on that
      # backlog. Re-fold web into `turbo lint` once that debt is cleared.
      - run: npx turbo lint --filter='!@koodakbook/web'
      - run: npx tsc --noEmit -p apps/web/tsconfig.json

      # Backend's own unit suite (leitner/probe/streak/gate/wordProgress —
      # the spaced-repetition core, see project.md). Web/admin/mobile have no
      # unit tests of their own yet.
      - run: npm --workspace=@koodakbook/backend run test

  e2e:
    name: end-to-end (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run e2e
